<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Flux HLS</title>
    <!-- Importation de la bibliothèque Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0f0f13;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #00e5ff;
            font-weight: 400;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            background-color: #000;
            margin-bottom: 20px;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .status {
            color: #a3ff00;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>Lecteur Live TV</h1>
        
        <div class="status" id="status-message">Initialisation du lecteur...</div>

        <div class="video-wrapper">
            <!-- La balise vidéo HTML5 standard -->
            <video id="video-player" controls autoplay></video>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-player');
        const statusMessage = document.getElementById('status-message');
        
        // Ton lien direct .m3u8
        const streamUrl = 'https://lb2.oztvlb.site/blcco/live/843_.m3u8';

        // Vérification de la compatibilité du navigateur avec Hls.js
        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: false // Mettre sur true pour voir les logs dans la console en cas de problème
            });
            
            statusMessage.textContent = "Chargement du flux en cours...";
            
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                statusMessage.textContent = "Flux prêt. En direct.";
                video.play().catch(error => {
                    statusMessage.textContent = "Lecture automatique bloquée. Cliquez sur Play.";
                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    statusMessage.textContent = "Erreur fatale lors du chargement du flux.";
                    statusMessage.style.color = "#ff4444"; // Rouge pour les erreurs
                }
            });
        } 
        // Alternative pour Safari (qui lit le HLS nativement)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                statusMessage.textContent = "Flux prêt (Natif).";
                video.play();
            });
        } else {
            statusMessage.textContent = "Votre navigateur ne supporte pas la lecture de ce format.";
            statusMessage.style.color = "#ff4444";
        }
    </script>

</body>
</html>
