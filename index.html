<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Flux API (Proxy CORS)</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #00e5ff;
            text-align: center;
            font-weight: 400;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            color: #00e5ff;
            border: 1px solid #00e5ff;
            padding: 10px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00e5ff;
            color: #0f0f13;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .output-wrapper {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border-left: 3px solid #00e5ff;
        }

        pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            color: #a3ff00;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>Extraction de l'API</h1>
        
        <div class="controls">
            <button onclick="fetchData()">Charger la liste des chaînes</button>
        </div>

        <div class="output-wrapper">
            <pre id="api-content">Cliquez sur le bouton pour lire le contenu de l'API avec le proxy...</pre>
        </div>
    </div>

    <script>
        async function fetchData() {
            const displayArea = document.getElementById('api-content');
            
            // Utilisation du proxy CORS AllOrigins pour contourner le blocage du navigateur
            const targetUrl = 'https://api.apioztv.online';
            const apiUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl); 
            
            displayArea.textContent = "Connexion en cours via le proxy...";

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Erreur réseau : ${response.status} ${response.statusText}`);
                }

                const contentType = response.headers.get("content-type");
                
                let data;
                if (contentType && contentType.includes("application/json")) {
                    const jsonData = await response.json();
                    data = JSON.stringify(jsonData, null, 4);
                } else {
                    data = await response.text();
                }

                displayArea.textContent = data;

            } catch (error) {
                displayArea.textContent = "Erreur persistante.\n\nDétail : " + error.message;
            }
        }
    </script>

</body>
</html>
